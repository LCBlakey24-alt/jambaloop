name: Fire TV app
# Builds the Jambaloop Fire TV app (fire-tv-app/): a full-screen window onto the website, set up as the TV.
# The APK is kept as this run's artifact, to install on a Fire TV Stick with the Downloader app.
on:
  push:
    paths:
      - 'fire-tv-app/**'
      - '.github/workflows/fire-tv-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the app
        working-directory: fire-tv-app
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Check the app
        run: |
          APK=fire-tv-app/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|launchable-activity|leanback|banner|sdkVersion|targetSdkVersion"
      - uses: actions/upload-artifact@v4
        with:
          name: jambaloop-fire-tv
          path: fire-tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
