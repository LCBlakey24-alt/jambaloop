name: Import pre-generated narrator audio (one-time)
on:
  push:
    branches: [design/06-dark-animated-launcher]
    paths: [.github/workflows/import-narrator.yml]
permissions:
  contents: write
jobs:
  copy-recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download previously generated audio as static site asset
        env:
          INTRO_QUIZRACE: 'https://elevenlabsusercontent.com/database/workspace/ab21d792f05f486fb0434850537aca0d/content_generation/CxKfpZKPfcstqS8POFmt/3PxKJHw4v7CoHHfFPjRC/content.mp3?Expires=1795377600&KeyName=assets-cdn-key-1&Signature=C75aXN9M7awn1n9A4cGjOkGnYTs='
        run: |
          mkdir -p public/audio/narrator
          curl --fail --location --silent --show-error --retry 2 --max-time 40 "$INTRO_QUIZRACE" --output public/audio/narrator/quizrace.mp3
          test "$(stat -c%s public/audio/narrator/quizrace.mp3)" -gt 6000
          file public/audio/narrator/quizrace.mp3
          echo "Stored quizrace: $(stat -c%s public/audio/narrator/quizrace.mp3) bytes"
      - name: Commit static audio to design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/narrator
          git diff --cached --quiet || git commit -m "Bundle generated Quiz Race introduction recording"
          git push origin HEAD:design/06-dark-animated-launcher
