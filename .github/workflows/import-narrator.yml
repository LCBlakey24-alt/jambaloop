name: Import pre-generated narrator audio (one-time)
on:
  push:
    branches: [design/06-dark-animated-launcher]
    paths: [.github/workflows/import-narrator.yml]
permissions:
  contents: write
jobs:
  copy-recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download the two completed narrator recordings
        env:
          INTRO_CLASSIC: 'https://elevenlabsusercontent.com/database/workspace/ab21d792f05f486fb0434850537aca0d/content_generation/PNkGu9mfjbsSll0PpglF/dMGO0A1Q01V84rIheLSA/content.mp3?Expires=1795381200&KeyName=assets-cdn-key-1&Signature=mUdTs0bEUaC9xvdX9ZA6Z7BqEPg='
          INTRO_BOARD: 'https://elevenlabsusercontent.com/database/workspace/ab21d792f05f486fb0434850537aca0d/content_generation/Rtej1Uz3IRvkQg8u3bRN/T17OYStKNqfd3SMwTHJN/content.mp3?Expires=1795381200&KeyName=assets-cdn-key-1&Signature=8k8n8urqe9K5xlX9nZPS8fOqNY8='
        run: |
          mkdir -p public/audio/narrator
          for kind in classic board; do
            case "$kind" in classic) url="$INTRO_CLASSIC" ;; board) url="$INTRO_BOARD" ;; esac
            curl --fail --location --silent --show-error --retry 2 --max-time 40 "$url" --output "public/audio/narrator/$kind.mp3"
            test "$(stat -c%s "public/audio/narrator/$kind.mp3")" -gt 6000
            file "public/audio/narrator/$kind.mp3"
            echo "Stored $kind: $(stat -c%s "public/audio/narrator/$kind.mp3") bytes"
          done
      - name: Commit static audio to design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/narrator
          git diff --cached --quiet || git commit -m "Bundle generated Classic and Board Race narrator introductions"
          git push origin HEAD:design/06-dark-animated-launcher
