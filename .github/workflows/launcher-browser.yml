name: Jambaloop launcher browser layout
on:
  pull_request:
    paths:
      - 'public/home-*'
      - 'public/index.html'
      - 'public/app.js'
      - 'public/game-night*'
      - 'public/room-avatars.js'
      - 'server.js'
      - 'public/mobile-deck.js'
      - 'scripts/launcher-browser.mjs'
      - 'scripts/board-team-browser.mjs'
      - 'scripts/fork-browser.mjs'
      - 'scripts/same-page-browser.mjs'
      - 'scripts/tv-all-modes.mjs'
      - 'scripts/spotlight-browser.mjs'
      - 'scripts/brain-ladder-browser.mjs'
      - 'scripts/top-answers-browser.mjs'
      - 'scripts/rare-find-browser.mjs'
      - 'scripts/game-night-browser.mjs'
      - 'scripts/player-live-browser.mjs'
      - 'scripts/quiz-race-error-browser.mjs'
      - 'public/player-live.css'
      - 'scripts/legacy-party-browser.mjs'
      - 'scripts/party-cards-browser.mjs'
      - 'scripts/bluff-browser.mjs'
      - 'scripts/sketch-browser.mjs'
      - 'public/sketch-*'
      - 'sketch-*'
      - 'test/sketch-sprint.test.js'
      - 'public/narration-scripts.js'
      - 'public/bluff-show*'
      - 'public/bluff-view.js'
      - 'test/spot-the-bluff.test.js'
      - 'party-games.js'
      - 'public/party-views.js'
      - 'rare-find.js'
      - 'rare-find-bank.js'
      - 'public/rare-find*'
      - 'public/top-answers*'
      - 'top-answers.js'
      - 'public/brain-ladder*'
      - 'brain-ladder.js'
      - 'public/spotlight*'
      - 'public/same-page*'
      - 'public/tv-broadcast.css'
      - 'public/publisher-brand.css'
      - 'test/publisher-brand.test.js'
      - 'public/fork-*'
      - 'fork-game.js'
      - 'public/board-*.js'
      - 'public/team-play*'
      - 'released-games.js'
      - 'public/tv-immersive.css'
      - 'public/race-3d.js'
      - 'public/race-course.js'
      - 'public/quiz-race*'
      - 'scripts/tv-immersive-browser.mjs'
      - 'public/visual-polish.css'
      - 'public/motion.js'
      - 'public/board.js'
      - 'public/presentation.css'
      - 'public/so-close*'
      - 'public/game-config.js'
      - 'public/game-show-batch-1.css'
      - 'public/game-show-batch-2.css'
      - 'public/mode-style.js'
      - 'public/show-identity.js'
      - 'scripts/so-close-browser.mjs'
      - 'scripts/question-types-browser.mjs'
      - 'scripts/show-moments-browser.mjs'
      - 'scripts/knockout-browser.mjs'
      - 'scripts/lobby-picker-browser.mjs'
      - 'scripts/welcome-show-browser.mjs'
      - 'scripts/host-reactions-browser.mjs'
      - 'public/welcome-show.js'
      - 'public/narrator.js'
      - 'public/duo-scripts.js'
      - 'public/lobby-picker.js'
      - 'public/knockout-ladder.js'
      - 'public/show-moments.*'
      - 'public/show-scenes.js'
      - 'public/scenes/**'
      - 'public/game-identities.*'
      - 'public/score-break.js'
      - '.github/workflows/launcher-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application and temporary browser test runner
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Start local multiplayer web server
        run: |
          PORT=32000 npm start > /tmp/jambaloop-launcher.log 2>&1 &
          for i in {1..25}; do
            curl --silent --fail http://127.0.0.1:32000 > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/jambaloop-launcher.log
          exit 1
      - name: Test responsive launcher, no page scroll and game previews
        env:
          SITE: http://127.0.0.1:32000
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          node scripts/launcher-browser.mjs
          node scripts/board-team-browser.mjs
          node scripts/fork-browser.mjs
          node scripts/same-page-browser.mjs
          node scripts/spotlight-browser.mjs
          node scripts/brain-ladder-browser.mjs
          node scripts/top-answers-browser.mjs
          node scripts/rare-find-browser.mjs
          node scripts/game-night-browser.mjs
          node scripts/player-live-browser.mjs
          node scripts/quiz-race-error-browser.mjs
          node scripts/legacy-party-browser.mjs
          node scripts/party-cards-browser.mjs
          node scripts/bluff-browser.mjs
          node scripts/sketch-browser.mjs
          node scripts/so-close-browser.mjs
          node scripts/question-types-browser.mjs
          node scripts/show-moments-browser.mjs
          node scripts/knockout-browser.mjs
          node scripts/lobby-picker-browser.mjs
          node scripts/welcome-show-browser.mjs
          node scripts/host-reactions-browser.mjs
          node scripts/commentators-browser.mjs
          node scripts/race-powers-browser.mjs
          node scripts/race-league-browser.mjs
          node scripts/symbol-race-browser.mjs
          node scripts/bloodmoon-browser.mjs
          node scripts/live-guesses-browser.mjs
          node scripts/short-phone-browser.mjs
          node scripts/qr-scan-browser.mjs
          node scripts/game-guide-browser.mjs
          node scripts/shade-browser.mjs
          node scripts/dont-look-browser.mjs
          node scripts/catch-up-browser.mjs
          node scripts/tv-immersive-browser.mjs
          node scripts/tv-all-modes.mjs
      - name: Upload screen captures on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-responsive-review
          path: browser-screenshots/
          if-no-files-found: ignore
