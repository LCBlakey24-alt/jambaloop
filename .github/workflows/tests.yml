name: Quiz Club tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate syntax
        run: |
          find . -path './node_modules' -prune -o -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Run test suite
        run: npm test
